[General]
; Hold this key while pressing Scrap at a weapon or armor workbench to scrap every
; unequipped copy in the selected row. Windows virtual-key code: 0x10 = Shift,
; 0x11 = Ctrl, 0x12 = Alt.
StackModifierKey=0x10

; Log yields and list state around every scrap to ScrapStacks.log
; (Documents\My Games\Fallout4\F4SE). Turn on when reporting a problem.
Diagnostics=0
